name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Compress large video files before build
        run: |
          echo "=== Video sizes BEFORE compression ==="
          du -sh public/*.mp4 || echo "No mp4s found in public/"
          ls -la public/*.mp4 || true

          # ffmpeg is pre-installed on ubuntu-latest GitHub runners
          if [ -f "public/go.mp4" ]; then
            echo "Compressing go.mp4..."
            ffmpeg -i public/go.mp4 -vcodec libx264 -crf 32 -preset ultrafast -vf "scale=1280:-2" -an public/go_compressed.mp4 -y
            mv public/go_compressed.mp4 public/go.mp4
          fi

          if [ -f "public/zo.mp4" ]; then
            echo "Compressing zo.mp4..."
            ffmpeg -i public/zo.mp4 -vcodec libx264 -crf 32 -preset ultrafast -vf "scale=1280:-2" -an public/zo_compressed.mp4 -y
            mv public/zo_compressed.mp4 public/zo.mp4
          fi

          echo "=== Video sizes AFTER compression ==="
          du -sh public/*.mp4 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build
        env:
          VITE_BASE_PATH: /anime/
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: npm run build

      - name: Show final artifact size
        run: |
          echo "=== Final dist size ==="
          du -sh dist/
          du -sh dist/*.mp4 || echo "No mp4s at dist root"

      - name: Verify build output
        run: |
          test -f dist/index.html && echo "index.html FOUND" || (echo "ERROR: index.html MISSING" && exit 1)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
