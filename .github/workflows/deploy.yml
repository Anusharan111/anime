name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build
        env:
          VITE_BASE_PATH: /anime/
        run: npm run build

      - name: Optimize heavy media assets for fast Pages deployment
        run: |
          cd dist
          echo "Original dist folder size:"
          du -sh .
          if command -v ffmpeg &> /dev/null; then
            echo "Compressing background video assets with ffmpeg..."
            [ -f "go.mp4" ] && ffmpeg -i go.mp4 -vcodec libx264 -crf 28 -preset ultrafast -an go_opt.mp4 -y && mv go_opt.mp4 go.mp4 || true
            [ -f "zo.mp4" ] && ffmpeg -i zo.mp4 -vcodec libx264 -crf 28 -preset ultrafast -an zo_opt.mp4 -y && mv zo_opt.mp4 zo.mp4 || true
          fi
          echo "Optimized dist folder size:"
          du -sh .

      - name: Verify build output
        run: |
          test -f dist/index.html && echo "index.html FOUND" || (echo "ERROR: index.html MISSING" && exit 1)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
